# =====================================================================
# Publicacao do site do Ateliê Afro Cultural.
#
# Migracao para Next.js 16: o build agora existe (next build) e publica
# .next via @netlify/plugin-nextjs.
# =====================================================================

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  # Mantido: e o que impede o embedded-postgres (devDependency) de baixar os
  # binarios do PostgreSQL e derrubar o build, como ja aconteceu. Por isso
  # typescript e @types/* estao em dependencies — ver spec §7.2.
  NPM_FLAGS = "--omit=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# TEMPORARIO: a Tarefa 6 move estes cabecalhos para o middleware.ts, que e
# onde eles precisam ficar (o CSP exige nonce por requisicao, e arquivo
# estatico nao gera nonce). Ate la eles ficam aqui, porque sem o noindex uma
# previa publicada seria indexada pelo Google.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
