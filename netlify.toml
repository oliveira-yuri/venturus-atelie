# =====================================================================
# Publicacao do site do Ateliê Afro Cultural.
#
# O site e estatico puro: HTML, CSS e JavaScript servidos como estao, sem
# etapa de construcao. As dependencias do package.json (selenium-webdriver
# e embedded-postgres) sao ferramentas de teste que rodam na maquina de
# desenvolvimento — o embedded-postgres inclusive baixa os binarios do
# PostgreSQL, o que faz a instalacao falhar aqui e nao serve para nada em
# producao. Por isso a instalacao e pulada.
# =====================================================================

[build]
  publish = "site"
  command = "echo 'Site estatico: nada a construir.'"

[build.environment]
  # Nao instalar nada: nao ha dependencia de producao.
  NETLIFY_SKIP_NPM_INSTALL = "true"
  NPM_FLAGS = "--no-optional"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # PREVIA: impede que buscadores indexem o rascunho. Remover no lancamento,
    # junto com o Disallow de site/robots.txt.
    X-Robots-Tag = "noindex, nofollow"

# As fontes sao versionadas e nunca mudam de conteudo sem mudar de nome.
[[headers]]
  for = "/assets/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
