# =====================================================================
# Publicacao do site do Ateliê Afro Cultural.
#
# Migracao para Next.js 16: o build agora existe (next build) e publica
# .next via @netlify/plugin-nextjs.
# =====================================================================

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  # Mantido: e o que impede o embedded-postgres (devDependency) de baixar os
  # binarios do PostgreSQL e derrubar o build, como ja aconteceu. Por isso
  # typescript e @types/* estao em dependencies — ver spec §7.2.
  NPM_FLAGS = "--omit=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Os cabecalhos de seguranca saem daqui: a partir da Tarefa 6 quem os aplica
# e o middleware.ts, porque o CSP precisa de nonce por requisicao e arquivo
# estatico nao gera nonce.
