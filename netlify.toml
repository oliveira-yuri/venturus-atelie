[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # PREVIA: impede que buscadores indexem o rascunho. Remover no lancamento,
    # junto com o Disallow de site/robots.txt.
    X-Robots-Tag = "noindex, nofollow"
